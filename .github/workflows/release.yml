name: Release

# On a version tag (e.g. v2.0.2), build the standalone portable executable and
# publish it as a GitHub release asset named SpicetifyInstaller.exe. The app's
# built-in updater downloads this asset by that fixed name and swaps itself in.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - name: Build portable executable
        run: bun run tauri build --no-bundle

      - name: Stage portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item "src-tauri/target/release/spicetify-installer.exe" "dist-release/SpicetifyInstaller.exe"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "Spicetify Installer ${{ github.ref_name }}"
          files: dist-release/SpicetifyInstaller.exe
          draft: false
          prerelease: false
